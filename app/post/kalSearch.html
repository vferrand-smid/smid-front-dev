                    Pour le document <span style="color: red">*</span>
                    <svg
                            width="13"
                            height="8"
                            viewBox="0 0 13 8"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                                fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M12.6192 0.365305C12.1116 -0.121769 11.2884 -0.121769 10.7808 0.365305L6.5 4.4723L2.21924 0.365304C1.71156 -0.121769 0.888443 -0.12177 0.380762 0.365304C-0.126921 0.852378 -0.126921 1.64208 0.380762 2.12915L5.80769 7.33579C6.19459 7.70699 6.8054 7.70699 7.19231 7.33579L12.6192 2.12916C13.1269 1.64208 13.1269 0.852379 12.6192 0.365305Z"
                                fill="#2FC977"
                        />
                    </svg>

            </div>
            <section class="search-document"></section>

        <button class="button-photo disabled message">Faire la photo</button>
        <main class="kal-search-document-popup" style="display: none">
            <div class="kal-search-document-search-suggestion"></div>
        </main>
    </div>
</div>


<style>
    .kal-search-selected {
        border: 2px solid #2fc977 !important;
    }
    .kal-search-document-search-suggestion > div {
        text - align: center;
        line-height: 1;
    }
    .kal-search-document-search-suggestion > div img {
        width: 70px;
        height: 70px;
        object-fit: contain;
        flex-grow: 0;
        flex-shrink: 0;
    }
    .kal-search-document > section img,
    .kal-search-country > section > img {
        width: 100%;
        height: 100%;
        max-width: 30px;
        max-height: 30px;
        object-fit: contain;
    }
    .kal-search {
        border - radius: 8px;
        border: 2px solid #efefef;
        background: #fff;
        width: 700px;
        display: flex;
        padding: 10px;
        gap: 10px;
        box-sizing: border-box;
        isolation: isolate;
        margin-top: 40px;
    }
    .kal-search > div {
        display: flex;
        position: relative;
    }
    .kal-search > :first-child {
        flex: 5;
        width: 100%;
    }
    .kal-search > :last-child {
        flex: 6;
    }
    .kal-search > :last-child > div {
        flex: 1;
    }
    .kal-search-country h4,
    .kal-search-document h4 {
        color: #000;
        font-family: Georama;
        font-size: 15px;
        font-style: normal;
        font-weight: 600;
        line-height: normal;
    }
    .kal-search-country p,
    .kal-search-document p {
        color: rgba(77, 77, 77, 1);
        font-family: Georama;
        font-size: 15px;
        font-style: normal;
        font-weight: 400;
        line-height: 20px; /* 133.333% */
    }
    .kal-search-country,
    .kal-search-document {
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        width: 100%;
    }
    .kal-search-country {
        padding - right: 20px;
        border-right: 2px solid #efefef;
    }
    .kal-search-country section,
    .kal-search-document section {
        display: flex;
        gap: 10px;
        align-items: center;
        width: fit-content;
        padding: 10px;
        height: 60px;
        box-sizing: border-box;
        width: 100%;
        cursor: pointer;
    }
    .kal-search button{
        color: #fff;
        text-align: center;
        font-family: Georama;
        font-size: 16px;
        font-style: normal;
        font-weight: 600;
        line-height: normal;
        border-radius: 26px;
        background: #000;
        height: fit-content;
        padding: 16px 24px;
        align-self: center;
        cursor: pointer;
    }
    .disabled {
        opacity: 0.5; /* Opacité réduite pour griser le bouton */
        pointer-events: none; /* Désactivation des événements de clic */
        cursor: not-allowed; /* Curseur non autorisé lors du survol */
    }

    .kal-search-country-popup,
    .kal-search-document-popup {
        position: absolute;
        bottom: 0;
        left: 0;
        transform: translateY(100%);
        background-color: white;
        min-height: 400px;
        width: 100%;
    }
    .kal-search-country-popup {
        margin - left: -12px;
        width: calc(100% + 10px);
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        border: 2px solid #efefef;
        border-top: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 400px;
    }
    .kal-search-document-popup {
        margin - left: -12px;
        width: calc(100% + 20px);
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        border: 2px solid #efefef;
        border-top: none;
        max-height: 400px;
    }
    .kal-search-country-search-container {
        background - color: #efefef;
        border-radius: 8px;
        padding: 10px;
        box-sizing: border-box;
        margin: 10px;
        display: flex;
        align-items: center;
        border: 2px solid #efefef;
        transition: all 0.2s;
        justify-content: space-between;
        border: none;
    }
    .kal-search-country-search-container:focus-within {
        border: 2px solid #2fc977;
    }
    .kal-search-country-search-container > input {
        background: transparent;
        border: none;
        outline: none;
        flex: 1;
        font-size: 16px;
        color: #4c4c4c;
        max-width: 80%;
        padding: 0;
    }
    .kal-search-country-search-container > input:focus {
        color: #4c4c4c;
        background-color: transparent;
        border: none;
    }
    .kal-search-country-search-container > svg {
        cursor: pointer;
        color: #4c4c4c;
    }
    .kal-search-country-search-suggestion {
        overflow - y: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
        scrollbar-width: none;
        line-height: 1;
    }
    .kal-search-country-search-suggestion img {
        width: 100%;
        height: 100%;
        max-width: 20px;
        max-height: 20px;
    }

    .kal-search-country-search-suggestion::-webkit-scrollbar {
        display: none;
    }
    .kal-search-country-search-suggestion > div {
        padding: 10px;
        border: 2px solid #efefef;
        transition: all 0.2s;
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
    }

    .kal-search-country-search-suggestion > div:hover {
        border: 2px solid rgba(47, 201, 119, 0.5);
    }
    .kal-search-document-search-suggestion {
        overflow - y: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px;
        scrollbar-width: none;
        width: 100%;
        grid-auto-rows: 150px;
    }
    .kal-search-document-search-suggestion::-webkit-scrollbar {
        display: none;
    }
    .kal-search-document-search-suggestion > div {
        padding: 6px;
        border: 2px solid #efefef;
        transition: all 0.2s;
        cursor: pointer;
        border-radius: 4px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-direction: column;
    }

    .kal-search-document-search-suggestion > div:hover {
        border: 2px solid rgba(47, 201, 119, 0.5);
    }

    @media screen and (max-width: 900px) {
        .kal-search {
            flex-direction: column;
        }
        .kal-search-country {
            border-right: none;
            padding-right: none;
        }
        .kal-search > :last-child {
            flex-direction: column;
        }
        .kal-search-document-popup {
            transform: translateY(85%);
        }
        .kal-search-document-popup,
        .kal-search-country-popup {
            z-index: 2;
            width: calc(100% + 20px) !important;
        }
        .kal-search button {
            margin-top: 30px;
        }
        .kal-search-country-search-suggestion > div {
            padding: 10px;

            font-size: 16px;
        }

        .disabled {
            opacity: 0.5; /* Opacité réduite pour griser le bouton */
            pointer-events: none; /* Désactivation des événements de clic */
            cursor: not-allowed; /* Curseur non autorisé lors du survol */
        }
    }
    @media screen and (max-width: 700px) {
        .kal-search {
            width: 100%;
        }

        .disabled {
            opacity: 0.5; /* Opacité réduite pour griser le bouton */
            pointer-events: none; /* Désactivation des événements de clic */
            cursor: not-allowed; /* Curseur non autorisé lors du survol */
        }
    }

    p,
    h4 {
        margin: 0;
    }
</style>

<script type="module">
    let selectedCountry = null;
    let selectedDocument = null;

    const selectCountryButton = document.querySelector(
        ".kal-search-country > section
    "
    )
    ;
    const selectDocumentButton = document.querySelector(
        ".kal-search-document > section
    "
    )
    ;
    const selectCountryPopup = document.getElementsByClassName(
        "kal-search-country-popup"
    )
        [0];
    const selectDocumentPopup = document.getElementsByClassName(
        "kal-search-document-popup"
    )
        [0];

    document.addEventListener("DOMContentLoaded", function () {
        const boutonPhoto = document.querySelector(".button-photo");
        const documentContainer = document.querySelector(".kal-search-document-search-suggestion");
        const messageElement = document.querySelector(".message"); // Ajoutez la classe message à l'élément qui affichera le message

        // Fonction pour désactiver le bouton
        const disableButton = () => {
            boutonPhoto.disabled = true;
            boutonPhoto.classList.add("disabled");
        };

        // Fonction pour activer le bouton
        const enableButton = () => {
            boutonPhoto.disabled = false;
            boutonPhoto.classList.remove("disabled");
        };

        // Écouter les clics sur les documents pour activer le bouton
        documentContainer.addEventListener("click", function(e) {
            const clickedElement = e.target.closest("div");
            if (clickedElement && clickedElement.parentElement === documentContainer) {
                enableButton(); // Activer le bouton si un document est sélectionné
            }
        });

        // Désactiver le bouton par défaut
        disableButton();

        // Gestion du clic sur le bouton photo
        const photoButton = document.querySelector(".button-photo");
        photoButton.addEventListener("click", () => {
            const platform = window.innerWidth > 700 ? "desktop" : "mobile";
            const hasEverything = Boolean(selectedDocument) && Boolean(selectedCountry);
            if (!hasEverything) {
                window.open(`https://smartphone-id-app.com/${platform}`, "_black");
            } else {
                window.open(
                    `https://smartphone-id-app.com/${platform}/photo/${selectedDocument}/${selectedCountry}`,
                    "_black"
                );
            }
        });

        // Écouter les changements de pays
        const selectCountryButton = document.querySelector(".kal-search-country > section");
        selectCountryButton.addEventListener("click", () => {
            // Désactiver le bouton lors du changement de pays
            disableButton();
        });
    })
    ;

    document.addEventListener("click", (e) => {
        if (selectCountryPopup.contains(e.target)) {
        } else if (selectCountryButton.contains(e.target)) {
            if (selectCountryPopup.style.display == "none") {
                selectCountryPopup.style.display = "flex";
            } else {
                selectCountryPopup.style.display = "none";
            }
        } else {
            selectCountryPopup.style.display = "none";
        }
        if (selectDocumentPopup.contains(e.target)) {
        } else if (selectDocumentButton.contains(e.target)) {
            if (selectDocumentPopup.style.display == "none") {
                selectDocumentPopup.style.display = "flex";
            } else {
                selectDocumentPopup.style.display = "none";
            }
        } else {
            selectDocumentPopup.style.display = "none";
        }
    })
    ;

    const getCountries = async () => {
        const language = document.documentElement.lang;
        let countries = await fetch(
            "https://smartphoneid-api--master-2yx5ebbula-ew.a.run.app/country/customized"
            ,
            {
                headers: {
                    language: language.split("-")[0],
                },
            }
        ).then((res) => res.json());
        countries = countries.Countries.map((country) => ({
            name: country?.country_name,
            flag: `https://purecatamphetamine.github.io/country-flag-icons/3x2/${country?.country_code}.svg`,
            code: country.country_code,
        }));
        console.log(getCountries);
        return countries;
    };

    const getCurrentCountry = async () => {
        const currentC = await fetch("https://ipapi.co/country/").then((res) =>
            res.text()
        );
        return currentC;
    };

    const countries = await getCountries();

    const countriesContainer = document.querySelector(
            ".kal-search-country-search-suggestion"
        )
    ;

    const displayContainer = document.querySelector(
        ".kal-search-country > section
    "
    )
    ;

    const createCountriesNode = (countryList) => {
        countriesContainer.innerHTML = "";

        countryList.forEach((c) => {
            const ele = document.createElement("div");
            const img = document.createElement("img");
            img.setAttribute("src", c.flag);
            ele.appendChild(img);
            const text = document.createTextNode(c.name);
            ele.appendChild(text);

            ele.addEventListener("click", () => {
                selectedCountry = c.code;
                const newImg = img.cloneNode(true);
                const newText = text.cloneNode(true);
                displayContainer.innerHTML = "";
                displayContainer.appendChild(newImg);
                displayContainer.appendChild(newText);
                selectCountryPopup.style.display = "none";
                countriesContainer.childNodes.forEach((node) =>
                    node.classList.remove("kal-search-selected")
                );
                ele.classList.add("kal-search-selected");

                initDocument();
            });
            if (selectedCountry === c.code) {
                ele.classList.add("kal-search-selected");
            }
            countriesContainer.appendChild(ele);
        });
    };

    createCountriesNode(countries);

    const currentCountry = await getCurrentCountry();

    const inputSearch = document.querySelector(
        ".kal-search-country-search-container >
    input
    "
    )
    ;
    inputSearch.addEventListener("input", (e) => {
        const inputValue = e.target.value.toLowerCase();
        countriesContainer.innerHTML = "";
        const filteredCountries = countries.filter((c) =>
            c.name.toLowerCase().includes(inputValue)
        );
        createCountriesNode(filteredCountries);
    })
    ;

    // === select france by default === //
    const france = countries.filter((c) => c.code === "FR"
    )
        [0];
    selectedCountry = france.code;
    const img = document.createElement("img");
    img.setAttribute("src", france.flag
    )
    ;
    displayContainer.appendChild(img);
    const text = document.createTextNode(france.name);
    displayContainer.appendChild(text);

    const documentContainer = document.querySelector(
            ".kal-search-document-search-suggestion"
        )
    ;
    const displayDocument = document.querySelector(
        ".kal-search-document > section
    "
    )
    ;


    const initDocument = async () => {
        const language = document.documentElement.lang;
        documentContainer.innerHTML = "";
        displayDocument.innerHTML = "Choisissez le document";
        let docs = await fetch(
            `https://smartphoneid-api--master-2yx5ebbula-ew.a.run.app/price/from-country/${currentCountry}/to/${selectedCountry}`,
            {
                headers: {
                    language: language.split("-")[0],
                },
            }
        ).then((res) => res.json());

        docs = docs.result.map((doc) => ({
            name: doc.purpose.label,
            img: doc.purpose.icon == null ? "" : doc.purpose.icon.url,
            id: doc.id,
        }));

        selectedDocument = null;
        docs.forEach((d) => {
            const ele = document.createElement("div");
            const img = document.createElement("img");
            img.setAttribute("src", d.img);
            ele.appendChild(img);
            const text = document.createTextNode(d.name);
            ele.appendChild(text);

            ele.addEventListener("click", () => {
                selectedDocument = d.id;
                const newImg = img.cloneNode(true);
                const newText = text.cloneNode(true);
                displayDocument.innerHTML = "";
                displayDocument.appendChild(newImg);
                displayDocument.appendChild(newText);
                documentContainer.childNodes.forEach((node) =>
                    node.classList.remove("kal-search-selected")
                );
                ele.classList.add("kal-search-selected");

                selectDocumentPopup.style.display = "none";
            });

            documentContainer.appendChild(ele);
        });
    };
    initDocument();
</script>
